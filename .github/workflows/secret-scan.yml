name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: docker run --rm --volume "$PWD:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /scan --redact --no-banner
