# Supply a Git-aware export directory; never mount a working tree containing .env.
services:
  secret-scan:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    volumes:
      - "${SCAN_PATH:?Set SCAN_PATH to a sanitized source export}:/scan:ro"
    command: ["dir", "/scan", "--redact", "--no-banner", "--max-archive-depth", "2"]
    network_mode: none
